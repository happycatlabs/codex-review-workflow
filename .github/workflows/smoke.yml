name: Smoke (reusable)
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      model:
        type: string
        required: false
        default: gpt-5.5
      codex-cli-version:
        type: string
        required: false
        default: '0.124.0'
      sentry-project:
        type: string
        required: false
        default: ''
      sentry-org:
        type: string
        required: false
        default: happycatlabs
      sentry-ticket-regex:
        type: string
        required: false
        default: ''
    secrets:
      CODEX_AUTH_JSON:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false
jobs:
  smoke:
    runs-on: ${{ inputs.runner }}
    steps:
      - run: echo "smoke with full inputs/secrets shape, sentry-project=${{ inputs.sentry-project }}"
