name: Codex Code Review (reusable)

# Trust flow:
# 1. guard verifies a base-controlled pull_request_target for the default branch;
# 2. prepare performs bounded exact-head source reads through trusted code;
# 3. intent resolves one owner-bound ticket with protected read credentials;
# 4. review receives only a generated prompt and no tools or credentials;
# 5. publish refetches exact PR/base state and emits the machine result.

on:
  workflow_call:
    inputs:
      model:
        description: 'Codex model used for review.'
        type: string
        required: false
        default: gpt-5.5
      codex-cli-version:
        description: 'Pinned @openai/codex version used by codex-action.'
        type: string
        required: false
        default: '0.144.1'
      allow-users:
        description: 'Additional trusted GitHub users accepted by codex-action.'
        type: string
        required: false
        default: ''
      allow-bot-users:
        description: 'Trusted bot users accepted by codex-action.'
        type: string
        required: false
        default: ''
      linear-team-key:
        description: 'Protected caller-owned Linear team key.'
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        description: 'Supported CI credential for Codex review.'
        required: false
      CODEX_AUTH_JSON:
        description: 'Legacy subscription credential. Detected only to fail closed.'
        required: false
      LINEAR_CLIENT_ID:
        description: 'Read-only Linear OAuth client identifier.'
        required: false
      LINEAR_CLIENT_SECRET:
        description: 'Read-only Linear OAuth client secret.'
        required: false

concurrency:
  group: codex-source-context-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-guard:
    name: Require current default-branch pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      default_branch: ${{ steps.resolve.outputs.default_branch }}
      default_branch_sha: ${{ steps.resolve.outputs.default_branch_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      state: ${{ steps.resolve.outputs.state }}
    steps:
      - name: Resolve current trusted pull request state
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != pull_request_target ]; then
            echo "Only pull_request_target callers are accepted." >&2
            exit 1
          fi
          if [ -z "${PR_NUMBER}" ] || [ -z "${REPOSITORY}" ]; then
            echo "Pull request identity is missing." >&2
            exit 1
          fi

          repo_json=$(mktemp)
          pr_json=$(mktemp)
          gh api "repos/${REPOSITORY}" > "${repo_json}"
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_json}"

          default_branch=$(jq -er '.default_branch' "${repo_json}")
          encoded_default_branch=$(jq -rn --arg value "${default_branch}" '$value | @uri')
          default_commit_json=$(mktemp)
          gh api "repos/${REPOSITORY}/commits/${encoded_default_branch}" \
            > "${default_commit_json}"
          default_branch_sha=$(jq -er '.sha' "${default_commit_json}")
          state=$(jq -er '.state' "${pr_json}")
          base_ref=$(jq -er '.base.ref' "${pr_json}")
          base_sha=$(jq -er '.base.sha' "${pr_json}")
          head_sha=$(jq -er '.head.sha' "${pr_json}")

          if [ -n "${EVENT_DEFAULT_BRANCH}" ] \
              && [ "${EVENT_DEFAULT_BRANCH}" != "${default_branch}" ]; then
            echo "Default branch changed while resolving the event." >&2
            exit 1
          fi
          if [ -n "${EVENT_BASE_REF}" ] && [ "${EVENT_BASE_REF}" != "${base_ref}" ]; then
            echo "Pull request base changed while resolving the event." >&2
            exit 1
          fi
          if [ "${state}" != open ]; then
            echo "Pull request is not open." >&2
            exit 1
          fi
          if [ "${base_ref}" != "${default_branch}" ]; then
            echo "Pull request does not target the current default branch." >&2
            exit 1
          fi
          if ! [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "${default_branch_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull request commit identity is invalid." >&2
            exit 1
          fi
          if [ "${base_sha}" != "${default_branch_sha}" ]; then
            echo "Pull request base is not the current default-branch commit." >&2
            exit 1
          fi

          {
            echo "default_branch=${default_branch}"
            echo "default_branch_sha=${default_branch_sha}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "state=${state}"
          } >> "${GITHUB_OUTPUT}"

  prepare:
    name: Prepare bounded exact-head source packet
    needs: trust-guard
    if: ${{ needs.trust-guard.result == 'success' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ needs.trust-guard.outputs.head_sha }}
      BASE_REF: ${{ needs.trust-guard.outputs.base_ref }}
      BASE_SHA: ${{ needs.trust-guard.outputs.base_sha }}
      DEFAULT_BRANCH_SHA: ${{ needs.trust-guard.outputs.default_branch_sha }}
      REVIEW_STATE: ${{ needs.trust-guard.outputs.state }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CHECKOUT_DIR: repo-checkout
      REVIEW_BUNDLE: codex-review-input
      MODEL_WORKSPACE: codex-review-input/model-workspace
      METADATA_DIR: codex-review-input/metadata
      STAGING_DIR: codex-review-input/staging
      TRUSTED_CONTEXT: codex-review-input/trusted-context

    steps:
      - name: Checkout exact reusable-workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-workflow
          persist-credentials: false
          sparse-checkout: src

      - name: Checkout exact pull request head as data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ${{ env.CHECKOUT_DIR }}
          ref: ${{ needs.trust-guard.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require reviewed base to be an ancestor of head
        run: |
          set -euo pipefail
          python3 "trusted-workflow/src/review_contract.py" check-ancestry \
            --repository "${CHECKOUT_DIR}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --error-output "${REVIEW_BUNDLE}/review-execution.json"

      - name: Build trusted guidance and untrusted diff data
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          checkout = pathlib.Path(os.environ["CHECKOUT_DIR"]).resolve()
          staging = pathlib.Path(os.environ["STAGING_DIR"]).resolve()
          trusted = pathlib.Path(os.environ["TRUSTED_CONTEXT"]).resolve()
          metadata = pathlib.Path(os.environ["METADATA_DIR"]).resolve()
          for directory in (staging, trusted, metadata):
              if directory.exists():
                  shutil.rmtree(directory)
              directory.mkdir(parents=True)

          head_sha = os.environ["HEAD_SHA"]
          base_sha = os.environ["BASE_SHA"]
          default_sha = os.environ["DEFAULT_BRANCH_SHA"]
          if base_sha != default_sha:
              raise ValueError("review base is not the resolved default-branch SHA")
          actual_head = subprocess.run(
              ["git", "-C", str(checkout), "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if actual_head != head_sha:
              raise ValueError("checkout did not resolve to the guarded PR head")
          subprocess.run(
              ["git", "-C", str(checkout), "cat-file", "-e", f"{default_sha}^{{commit}}"],
              check=True,
          )

          review_input = {
              "pull_number": int(os.environ["PR_NUMBER"]),
              "head_sha": head_sha,
              "base_ref": os.environ["BASE_REF"],
              "base_sha": base_sha,
              "state": os.environ["REVIEW_STATE"],
              "review_scope": "source_context_v1",
          }
          metadata.joinpath("review-input.json").write_text(
              json.dumps(review_input, indent=2) + "\n"
          )

          changed_output = subprocess.run(
              [
                  "git", "-C", str(checkout), "diff", "--name-only", "-z",
                  "--no-renames", "--no-ext-diff", "--no-textconv",
                  base_sha, head_sha,
              ],
              check=True,
              capture_output=True,
          ).stdout
          changed_files = [os.fsdecode(path) for path in changed_output.split(b"\0") if path]
          if any("\n" in path or "\r" in path for path in changed_files):
              raise ValueError("changed paths containing newlines are unsupported")
          staging.joinpath("changed-files.txt").write_text(
              "\n".join(changed_files) + ("\n" if changed_files else "")
          )

          def write_git_output(args: list[str], destination: pathlib.Path) -> None:
              output = subprocess.run(
                  ["git", "-C", str(checkout), "--no-pager", *args],
                  check=True,
                  capture_output=True,
              ).stdout
              destination.write_bytes(output)

          write_git_output(
              ["diff", "--numstat", "--find-renames", "--no-ext-diff", "--no-textconv",
               base_sha, head_sha],
              staging / "numstat.txt",
          )
          write_git_output(
              ["diff", "--name-status", "--find-renames", "--no-ext-diff", "--no-textconv",
               base_sha, head_sha],
              staging / "status.txt",
          )
          write_git_output(
              ["diff", "--function-context", "--unified=20", "--find-renames",
               "--no-ext-diff", "--no-textconv", base_sha, head_sha],
              staging / "diff.patch",
          )

          def copy_default_file(
              rel_path: str, destination: pathlib.Path | None = None
          ) -> bool:
              result = subprocess.run(
                  ["git", "-C", str(checkout), "show", f"{default_sha}:{rel_path}"],
                  capture_output=True,
              )
              if result.returncode != 0:
                  return False
              dest = destination or trusted.joinpath(*pathlib.PurePosixPath(rel_path).parts)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(result.stdout)
              return True

          if not copy_default_file("REVIEW.md"):
              raise ValueError("trusted default branch is missing required REVIEW.md")
          for rel_path in (
              "AGENTS.md",
              "docs/review.md",
              ".codex/skills/convex-best-practices/SKILL.md",
          ):
              copy_default_file(rel_path)

          packets = staging / "default-review-packets"
          packets.mkdir()
          packet_output = subprocess.run(
              ["git", "-C", str(checkout), "ls-tree", "-r", "-z", "--name-only",
               default_sha, "--", ".review"],
              check=True,
              capture_output=True,
          ).stdout
          for raw_path in packet_output.split(b"\0"):
              if not raw_path:
                  continue
              rel_path = os.fsdecode(raw_path)
              path = pathlib.PurePosixPath(rel_path)
              if path.parent == pathlib.PurePosixPath(".review") and path.suffix == ".md":
                  copy_default_file(rel_path, packets / path.name)
          PY

          python3 "trusted-workflow/src/review_contract.py" select-packets \
            --packets-dir "${STAGING_DIR}/default-review-packets" \
            --changed-files "${STAGING_DIR}/changed-files.txt" \
            --destination "${TRUSTED_CONTEXT}/.review" \
            --output "${METADATA_DIR}/activated-packets.json"

          python3 "trusted-workflow/src/review_contract.py" build-source-context \
            --repository "${CHECKOUT_DIR}" \
            --changed-files "${STAGING_DIR}/changed-files.txt" \
            --review-input "${METADATA_DIR}/review-input.json" \
            --output "${METADATA_DIR}/source-context.json" \
            --error-output "${REVIEW_BUNDLE}/review-execution.json"

          python3 "trusted-workflow/src/review_publication.py" build-comment-map \
            --repository "${CHECKOUT_DIR}" \
            --review-input "${METADATA_DIR}/review-input.json" \
            --output "${METADATA_DIR}/comment-map.json"

      - name: Upload prepared review data
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-prepared
          path: ${{ env.REVIEW_BUNDLE }}
          if-no-files-found: error
          retention-days: 3

  intent:
    name: Resolve exact-ticket intent and seal prompt
    needs: [trust-guard, prepare]
    if: ${{ always() && needs.trust-guard.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      review_matrix: ${{ steps.build-shards.outputs.review_matrix }}
    env:
      REVIEW_BUNDLE: codex-review-input
      MODEL_WORKSPACE: codex-review-input/model-workspace
      METADATA_DIR: codex-review-input/metadata
      STAGING_DIR: codex-review-input/staging
      TRUSTED_CONTEXT: codex-review-input/trusted-context

    steps:
      - name: Checkout exact reusable-workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-workflow
          persist-credentials: false
          sparse-checkout: src

      - name: Download prepared review data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-review-prepared
          path: codex-review-input

      - name: Resolve one owner-bound Linear ticket
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_TEAM_KEY: ${{ inputs.linear-team-key }}
        run: |
          set -euo pipefail
          helper=trusted-workflow/src/review_contract.py
          trap 'rm -f "${METADATA_DIR}/owner-comments.json"' EXIT
          python3 "${helper}" collect-owner-comments \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-number "${{ github.event.pull_request.number }}" \
            --output "${METADATA_DIR}/owner-comments.json" \
            --error-output "${REVIEW_BUNDLE}/review-execution.json"
          python3 "${helper}" collect-intent \
            --owner-comments "${METADATA_DIR}/owner-comments.json" \
            --review-input "${METADATA_DIR}/review-input.json" \
            --team-key "${LINEAR_TEAM_KEY}" \
            --output "${METADATA_DIR}/intent-context.json" \
            --error-output "${REVIEW_BUNDLE}/review-execution.json"

      - name: Build model-safe review partitions without credentials
        id: build-shards
        run: |
          set -euo pipefail
          mkdir -p "${MODEL_WORKSPACE}"
          cp trusted-workflow/src/codex-output-schema.json \
            "${MODEL_WORKSPACE}/codex-output-schema.json"
          python3 trusted-workflow/src/review_contract.py build-review-shards \
            --instructions trusted-workflow/src/review-instructions.md \
            --trusted-context "${TRUSTED_CONTEXT}" \
            --activated-packets "${METADATA_DIR}/activated-packets.json" \
            --review-input "${METADATA_DIR}/review-input.json" \
            --numstat "${STAGING_DIR}/numstat.txt" \
            --status "${STAGING_DIR}/status.txt" \
            --diff "${STAGING_DIR}/diff.patch" \
            --source-context "${METADATA_DIR}/source-context.json" \
            --intent-context "${METADATA_DIR}/intent-context.json" \
            --output-dir "${MODEL_WORKSPACE}/shards" \
            --manifest-output "${METADATA_DIR}/review-shards.json" \
            --coverage-output "${METADATA_DIR}/coverage.json" \
            --lookup-output "${METADATA_DIR}/lookup-context.json" \
            --error-output "${REVIEW_BUNDLE}/review-execution.json"
          review_matrix=$(jq -c \
            '{include:[.shards[] | {shard_id:.id}]}' \
            "${METADATA_DIR}/review-shards.json")
          echo "review_matrix=${review_matrix}" >> "${GITHUB_OUTPUT}"
          rm -rf "${STAGING_DIR}" "${TRUSTED_CONTEXT}"

      - name: Assert model filesystem contains generated files only
        run: |
          set -euo pipefail
          mapfile -t model_files < <(find "${MODEL_WORKSPACE}" -type f -print | sort)
          expected_count=$((1 + $(jq -r '.shard_count' "${METADATA_DIR}/review-shards.json")))
          if [ "${#model_files[@]}" -ne "${expected_count}" ] \
              || [ "${model_files[0]}" != "${MODEL_WORKSPACE}/codex-output-schema.json" ]; then
            printf 'Unexpected model workspace files:\n%s\n' "${model_files[*]}" >&2
            exit 1
          fi
          for shard_id in $(jq -r '.shards[].id' "${METADATA_DIR}/review-shards.json"); do
            expected="${MODEL_WORKSPACE}/shards/${shard_id}/codex-prompt.md"
            if ! printf '%s\n' "${model_files[@]}" | grep -Fxq "${expected}"; then
              echo "Missing generated review partition ${shard_id}." >&2
              exit 1
            fi
          done

      - name: Upload bounded review input
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-input
          path: ${{ env.REVIEW_BUNDLE }}
          if-no-files-found: error
          retention-days: 3

  review:
    name: Run no-tools Codex source-context review (${{ matrix.shard_id }})
    needs: [trust-guard, prepare, intent]
    if: ${{ always() && needs.trust-guard.result == 'success' && needs.prepare.result == 'success' && needs.intent.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.intent.outputs.review_matrix) }}
    steps:
      - name: Download bounded review input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-review-input
          path: codex-review-input

      - name: Resolve supported authentication and coverage
        id: readiness
        env:
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON != '' }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.complete' codex-review-input/metadata/lookup-context.json)" != true ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "code=SOURCE_CONTEXT_STALE" >> "${GITHUB_OUTPUT}"
          elif [ "$(jq -r '.complete' codex-review-input/metadata/coverage.json)" != true ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "code=INPUT_TRUNCATED" >> "${GITHUB_OUTPUT}"
          elif [ "${HAS_OPENAI_API_KEY}" = true ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            echo "code=" >> "${GITHUB_OUTPUT}"
          elif [ "${HAS_CODEX_AUTH_JSON}" = true ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "code=AUTH_LEGACY_UNSAFE" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "code=AUTH_MISSING" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare partition output directory
        run: mkdir -p codex-review-input/executions/${{ matrix.shard_id }}

      - name: Run Codex against generated prompt only
        id: run-codex
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-review-input/model-workspace/shards/${{ matrix.shard_id }}/codex-prompt.md
          output-file: codex-review-input/executions/${{ matrix.shard_id }}/codex-output.json
          output-schema-file: codex-review-input/model-workspace/codex-output-schema.json
          working-directory: codex-review-input/model-workspace/shards/${{ matrix.shard_id }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          codex-version: ${{ inputs.codex-cli-version }}
          codex-home: ${{ runner.temp }}/codex-review-home
          codex-args: '["--ephemeral","--disable","shell_tool","--disable","unified_exec"]'
          model: ${{ inputs.model }}
          allow-users: ${{ inputs.allow-users }}
          allow-bot-users: ${{ inputs.allow-bot-users }}

      - name: Record review execution
        if: ${{ always() }}
        env:
          READY: ${{ steps.readiness.outputs.ready }}
          READINESS_CODE: ${{ steps.readiness.outputs.code }}
          REVIEW_OUTCOME: ${{ steps.run-codex.outcome }}
        run: |
          set -euo pipefail
          shard_id="${{ matrix.shard_id }}"
          prompt="codex-review-input/model-workspace/shards/${shard_id}/codex-prompt.md"
          execution_dir="codex-review-input/executions/${{ matrix.shard_id }}"
          mkdir -p "${execution_dir}"
          prompt_sha256=$(sha256sum "${prompt}" | awk '{print $1}')
          prompt_bytes=$(wc -c < "${prompt}" | tr -d ' ')
          if [ "${READY}" != true ]; then
            jq -n --arg code "${READINESS_CODE}" --arg shard_id "${shard_id}" \
              --arg prompt_sha256 "${prompt_sha256}" --argjson prompt_bytes "${prompt_bytes}" \
              '{status:"error",code:$code,shard_id:$shard_id,
                prompt_sha256:$prompt_sha256,prompt_bytes:$prompt_bytes}' \
              > "${execution_dir}/review-execution.json"
          elif [ "${REVIEW_OUTCOME}" != success ]; then
            jq -n --arg shard_id "${shard_id}" --arg prompt_sha256 "${prompt_sha256}" \
              --argjson prompt_bytes "${prompt_bytes}" \
              '{status:"error",code:"REVIEW_FAILED",shard_id:$shard_id,
                prompt_sha256:$prompt_sha256,prompt_bytes:$prompt_bytes}' \
              > "${execution_dir}/review-execution.json"
          elif [ ! -s "${execution_dir}/codex-output.json" ]; then
            jq -n --arg shard_id "${shard_id}" --arg prompt_sha256 "${prompt_sha256}" \
              --argjson prompt_bytes "${prompt_bytes}" \
              '{status:"error",code:"MODEL_OUTPUT_MISSING",shard_id:$shard_id,
                prompt_sha256:$prompt_sha256,prompt_bytes:$prompt_bytes}' \
              > "${execution_dir}/review-execution.json"
          else
            jq -n --arg shard_id "${shard_id}" --arg prompt_sha256 "${prompt_sha256}" \
              --argjson prompt_bytes "${prompt_bytes}" \
              '{status:"success",shard_id:$shard_id,
                prompt_sha256:$prompt_sha256,prompt_bytes:$prompt_bytes}' \
              > "${execution_dir}/review-execution.json"
          fi

      - name: Upload raw review execution
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-execution-${{ matrix.shard_id }}
          path: codex-review-input/executions
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish exact-head source-context result
    needs: [trust-guard, prepare, intent, review]
    if: ${{ always() && needs.trust-guard.result == 'success' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_HEAD_SHA: ${{ needs.trust-guard.outputs.head_sha }}
      EXPECTED_BASE_REF: ${{ needs.trust-guard.outputs.base_ref }}
      EXPECTED_BASE_SHA: ${{ needs.trust-guard.outputs.base_sha }}
      EXPECTED_STATE: ${{ needs.trust-guard.outputs.state }}
      RESULT_ARTIFACT: codex-review-result

    steps:
      - name: Checkout exact reusable-workflow source
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-workflow
          persist-credentials: false
          sparse-checkout: src

      - name: Download bounded review input
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-review-input
          path: codex-review-input

      - name: Download prepared fallback
        if: ${{ needs.intent.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-review-prepared
          path: codex-review-input

      - name: Download raw review execution
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codex-review-execution-*
          merge-multiple: true
          path: codex-review-input/executions

      - name: Normalize missing preparation artifacts
        run: |
          set -euo pipefail
          mkdir -p codex-review-input/metadata codex-review-input/model-workspace codex-review-result
          if [ ! -s codex-review-input/metadata/review-input.json ]; then
            jq -n \
              --argjson pull_number "${PR_NUMBER}" \
              --arg head "${EXPECTED_HEAD_SHA}" \
              --arg base_ref "${EXPECTED_BASE_REF}" \
              --arg base_sha "${EXPECTED_BASE_SHA}" \
              --arg state "${EXPECTED_STATE}" \
              '{pull_number:$pull_number,head_sha:$head,base_ref:$base_ref,base_sha:$base_sha,
                state:$state,review_scope:"source_context_v1"}' \
              > codex-review-input/metadata/review-input.json
          fi
          if [ ! -s codex-review-input/metadata/activated-packets.json ]; then
            printf '["general"]\n' > codex-review-input/metadata/activated-packets.json
          fi
          if [ ! -s codex-review-input/metadata/coverage.json ]; then
            jq -n '{
              complete:false,truncated:true,prompt_limit_bytes:2000000,
              prompt_bytes_original:0,prompt_bytes_included:0,prompt_sha256:("0"*64),
              diff_bytes_original:0,diff_bytes_included:0,diff_sha256:("0"*64),
              diff_encoding:"utf-8",binary_files:false,
              status_bytes_original:0,trusted_guidance_bytes:0,
              source_context_bytes:0,intent_context_bytes:0
            }' > codex-review-input/metadata/coverage.json
          fi
          if [ ! -s codex-review-input/metadata/lookup-context.json ]; then
            printf '{"complete":false,"source":null,"intent":null}\n' \
              > codex-review-input/metadata/lookup-context.json
          fi
          if [ ! -s codex-review-input/metadata/comment-map.json ]; then
            jq -n \
              --argjson pull_number "${PR_NUMBER}" \
              --arg head "${EXPECTED_HEAD_SHA}" \
              --arg base_ref "${EXPECTED_BASE_REF}" \
              --arg base_sha "${EXPECTED_BASE_SHA}" \
              '{schema_version:"codex-review-comment-map/v1",complete:false,
                pull_number:$pull_number,head_sha:$head,base_ref:$base_ref,
                base_sha:$base_sha,diff_sha256:("0"*64),files:{}}' \
              > codex-review-input/metadata/comment-map.json
          fi
          if [ ! -s codex-review-input/review-execution.json ]; then
            if [ "${{ needs.prepare.result }}" != success ]; then
              printf '{"status":"error","code":"PREPARE_FAILED"}\n' \
                > codex-review-input/review-execution.json
            elif [ "${{ needs.intent.result }}" != success ]; then
              printf '{"status":"error","code":"TICKET_CONTEXT_MISSING"}\n' \
                > codex-review-input/review-execution.json
            else
              printf '{"status":"error","code":"REVIEW_FAILED"}\n' \
                > codex-review-input/review-execution.json
            fi
          fi

      - name: Combine complete partition results
        run: |
          set -euo pipefail
          helper=trusted-workflow/src/review_contract.py
          if [ -s "${helper}" ] \
              && [ -s codex-review-input/metadata/review-shards.json ]; then
            python3 "${helper}" combine-review-shards \
              --manifest codex-review-input/metadata/review-shards.json \
              --executions codex-review-input/executions \
              --model-output codex-review-input/model-workspace/codex-output.json \
              --execution-output codex-review-input/review-execution.json
          fi

      - name: Refetch current pull request and default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_json=$(mktemp)
          pr_json=$(mktemp)
          if ! gh api "repos/${REPOSITORY}" > "${repo_json}" \
              || ! gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_json}"; then
            printf '{"lookup_success":false}\n' > codex-review-result/current-pr.json
            exit 0
          fi
          default_branch=$(jq -r '.default_branch // ""' "${repo_json}")
          encoded_default_branch=$(jq -rn --arg value "${default_branch}" '$value | @uri')
          default_commit_json=$(mktemp)
          if [ -z "${default_branch}" ] \
              || ! gh api "repos/${REPOSITORY}/commits/${encoded_default_branch}" \
                > "${default_commit_json}"; then
            printf '{"lookup_success":false}\n' > codex-review-result/current-pr.json
            exit 0
          fi
          jq -n \
            --arg state "$(jq -r '.state // ""' "${pr_json}")" \
            --arg head_sha "$(jq -r '.head.sha // ""' "${pr_json}")" \
            --arg base_ref "$(jq -r '.base.ref // ""' "${pr_json}")" \
            --arg base_sha "$(jq -r '.base.sha // ""' "${pr_json}")" \
            --arg default_branch "${default_branch}" \
            --arg default_branch_sha "$(jq -r '.sha // ""' "${default_commit_json}")" \
            '{lookup_success:true,state:$state,head_sha:$head_sha,base_ref:$base_ref,
              base_sha:$base_sha,default_branch:$default_branch,
              default_branch_sha:$default_branch_sha}' \
            > codex-review-result/current-pr.json

      - name: Resolve immutable reusable workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_PATH: happycatlabs/codex-review-workflow/.github/workflows/codex-code-review.yml
        run: |
          set -euo pipefail
          run_json=$(mktemp)
          if ! gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${run_json}"; then
            printf '{}\n' > "${run_json}"
          fi
          RUN_JSON="${run_json}" python3 <<'PY'
          import json
          import os
          import pathlib
          import re

          try:
              run = json.loads(pathlib.Path(os.environ["RUN_JSON"]).read_text())
          except json.JSONDecodeError:
              run = {}
          expected = os.environ["EXPECTED_WORKFLOW_PATH"]
          referenced = run.get("referenced_workflows", [])
          if not isinstance(referenced, list):
              referenced = []
          matches = [
              item
              for item in referenced
              if isinstance(item, dict)
              and isinstance(item.get("path"), str)
              and re.fullmatch(rf"{re.escape(expected)}@[0-9a-f]{{40}}", item["path"])
          ]
          actual_sha = matches[0].get("sha", "") if len(matches) == 1 else ""
          path = matches[0].get("path", "") if len(matches) == 1 else ""
          if (
              len(matches) != 1
              or not isinstance(actual_sha, str)
              or not re.fullmatch(r"[0-9a-f]{40}", actual_sha)
              or path != f"{expected}@{actual_sha}"
          ):
              status = "error"
              code = "WORKFLOW_PROVENANCE_MISSING"
              actual_sha = ""
              path = ""
          else:
              status = "success"
              code = ""
          pathlib.Path("codex-review-result/workflow-provenance.json").write_text(
              json.dumps(
                  {
                      "status": status,
                      "code": code,
                      "path": path,
                      "actual_sha": actual_sha,
                  },
                  indent=2,
              )
              + "\n"
          )
          PY

      - name: Finalize machine result
        env:
          REVIEWER_REVISION: codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56;codex-cli@${{ inputs.codex-cli-version }};model@${{ inputs.model }}
        run: |
          set -euo pipefail
          helper=trusted-workflow/src/review_contract.py
          if [ ! -s "${helper}" ]; then
            reported_path=$(jq -r '.path // ""' codex-review-result/workflow-provenance.json)
            actual_revision=$(jq -r '.actual_sha // ""' codex-review-result/workflow-provenance.json)
            expected_path='happycatlabs/codex-review-workflow/.github/workflows/codex-code-review.yml'
            current_state=$(jq -r '.state // ""' codex-review-result/current-pr.json)
            current_head=$(jq -r '.head_sha // ""' codex-review-result/current-pr.json)
            current_base_ref=$(jq -r '.base_ref // ""' codex-review-result/current-pr.json)
            current_base_sha=$(jq -r '.base_sha // ""' codex-review-result/current-pr.json)
            current_default=$(jq -r '.default_branch // ""' codex-review-result/current-pr.json)
            current_default_sha=$(jq -r '.default_branch_sha // ""' codex-review-result/current-pr.json)
            preparation_code=$(jq -r '.code // ""' codex-review-input/review-execution.json)
            if ! [[ "${actual_revision}" =~ ^[0-9a-f]{40}$ ]] \
                || [ "${reported_path}" != "${expected_path}@${actual_revision}" ]; then
              code=WORKFLOW_PROVENANCE_MISSING
              reason='GitHub did not report the expected immutable reusable-workflow provenance.'
              actual_revision=''
            elif [ "$(jq -r '.lookup_success' codex-review-result/current-pr.json)" != true ]; then
              code=PR_STATE_LOOKUP_FAILED
              reason='The current pull request and default branch could not be verified.'
            elif [ "${current_state}" != open ]; then
              code=PR_STATE_INVALID
              reason='The pull request is no longer open.'
            elif [ "${current_base_ref}" != "${current_default}" ]; then
              code=BASE_BRANCH_INVALID
              reason='The pull request does not target the current default branch.'
            elif [ "${current_base_ref}" != "${EXPECTED_BASE_REF}" ] \
                || [ "${current_default}" != "${EXPECTED_BASE_REF}" ]; then
              code=BASE_REF_DRIFT
              reason='The pull request base branch changed after review preparation.'
            elif [ "${current_head}" != "${EXPECTED_HEAD_SHA}" ]; then
              code=STALE_HEAD
              reason='The pull request head changed after review preparation.'
            elif [ "${current_base_sha}" != "${current_default_sha}" ] \
                || [ "${current_default_sha}" != "${EXPECTED_BASE_SHA}" ]; then
              code=STALE_BASE
              reason='The default-branch base changed after review preparation.'
            elif [[ "${preparation_code}" =~ ^(BASE_NOT_ANCESTOR|SOURCE_CONTEXT_(FAILED|STALE|TIMEOUT|TRUNCATED)|TICKET_CONTEXT_(AUTH_MISSING|GRAPHQL_ERROR|INVALID|MISSING|STALE|TEAM_MISMATCH|TRUNCATED)|UNTRUSTED_MARKER_COLLISION)$ ]]; then
              code="${preparation_code}"
              reason='Trusted review context preparation failed closed.'
            else
              code=PREPARE_FAILED
              reason='The bounded review input could not be prepared.'
            fi
            # Backticks are literal Markdown formatting around the error code.
            # shellcheck disable=SC2016
            printf 'Codex review infrastructure error (`%s`): %s\n' "${code}" "${reason}" \
              > codex-review-result/comment-body.md
            jq -n \
              --argjson pull_number "${PR_NUMBER}" \
              --arg head "${EXPECTED_HEAD_SHA}" \
              --arg base_ref "${EXPECTED_BASE_REF}" \
              --arg base_sha "${EXPECTED_BASE_SHA}" \
              --arg state "${EXPECTED_STATE}" \
              --arg workflow_revision "${actual_revision}" \
              --arg reviewer_revision "${REVIEWER_REVISION}" \
              --arg code "${code}" \
              --arg reason "${reason}" \
              --rawfile summary codex-review-result/comment-body.md \
              --slurpfile coverage codex-review-input/metadata/coverage.json \
              --slurpfile lookup codex-review-input/metadata/lookup-context.json \
              '{schema_version:"codex-review-result/v3",verdict:"error",
                pull_number:$pull_number,head_sha:$head,
                base_ref:$base_ref,base_sha:$base_sha,state:$state,
                review_scope:"source_context_v1",
                activated_packets:["general"],coverage:$coverage[0],
                lookup_context:$lookup[0],summary:($summary|rtrimstr("\n")),findings:[],
                blocking_count:0,
                non_blocking_count:0,finding_fingerprints:[],workflow_revision:$workflow_revision,
                reviewer_revision:$reviewer_revision,error:{code:$code,reason:$reason},
                publication:{status:"pending",mode:"summary",
                  fallback_reason:null,inline_comment_count:0}}' \
              > codex-review-result/codex-review-result.json
            exit 0
          fi
          python3 "${helper}" finalize \
            --model-output codex-review-input/model-workspace/codex-output.json \
            --execution codex-review-input/review-execution.json \
            --activated-packets codex-review-input/metadata/activated-packets.json \
            --coverage codex-review-input/metadata/coverage.json \
            --lookup-context codex-review-input/metadata/lookup-context.json \
            --review-input codex-review-input/metadata/review-input.json \
            --current-pr codex-review-result/current-pr.json \
            --provenance codex-review-result/workflow-provenance.json \
            --reviewer-revision "${REVIEWER_REVISION}" \
            --output codex-review-result/codex-review-result.json \
            --comment-output codex-review-result/comment-body.md

      - name: Plan COMMENT review publication
        run: |
          set -euo pipefail
          helper=trusted-workflow/src/review_publication.py
          if [ -s "${helper}" ]; then
            python3 "${helper}" plan \
              --result codex-review-result/codex-review-result.json \
              --comment-map codex-review-input/metadata/comment-map.json \
              --output codex-review-result/codex-review-result.json \
              --request-output codex-review-result/review-request.json \
              --summary-request-output codex-review-result/summary-review-request.json
          else
            jq -n \
              '{body:"Codex review publication helper is unavailable.",
                event:"COMMENT"}' \
              > codex-review-result/review-request.json
            cp codex-review-result/review-request.json \
              codex-review-result/summary-review-request.json
            jq '.verdict="error"
              | .error={code:"COMMENT_HELPER_MISSING",
                  reason:"The trusted publication helper is unavailable."}
              | .publication={status:"failed",mode:"summary",
                  fallback_reason:"COMMENT_HELPER_MISSING",inline_comment_count:0}' \
              codex-review-result/codex-review-result.json \
              > codex-review-result/codex-review-result.tmp
            mv codex-review-result/codex-review-result.tmp \
              codex-review-result/codex-review-result.json
          fi

      - name: Revalidate and publish COMMENT review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper=trusted-workflow/src/review_publication.py
          result=codex-review-result/codex-review-result.json
          request=codex-review-result/review-request.json
          summary_request=codex-review-result/summary-review-request.json
          planned_status=$(jq -r '.publication.status' "${result}")
          planned_mode=$(jq -r '.publication.mode' "${result}")
          planned_fallback=$(jq -r '.publication.fallback_reason // ""' "${result}")
          planned_inline=$(jq -r '.publication.inline_comment_count' "${result}")
          status=failed
          mode="${planned_mode}"
          fallback_reason="${planned_fallback}"
          inline_count="${planned_inline}"

          repo_json=$(mktemp)
          pr_json=$(mktemp)
          default_commit_json=$(mktemp)
          state_valid=false
          generation_current=false
          refresh_generation_state() {
            state_valid=false
            generation_current=false
            if gh api "repos/${REPOSITORY}" > "${repo_json}" \
                && gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_json}"; then
              default_branch=$(jq -r '.default_branch // ""' "${repo_json}")
              encoded_default_branch=$(jq -rn --arg value "${default_branch}" '$value | @uri')
              if [ -n "${default_branch}" ] \
                  && gh api "repos/${REPOSITORY}/commits/${encoded_default_branch}" \
                    > "${default_commit_json}"; then
                state_valid=true
                current_state=$(jq -r '.state // ""' "${pr_json}")
                current_head=$(jq -r '.head.sha // ""' "${pr_json}")
                current_base_ref=$(jq -r '.base.ref // ""' "${pr_json}")
                current_base_sha=$(jq -r '.base.sha // ""' "${pr_json}")
                current_default_sha=$(jq -r '.sha // ""' "${default_commit_json}")
                if [ "${current_state}" = open ] \
                    && [ "${current_head}" = "${EXPECTED_HEAD_SHA}" ] \
                    && [ "${current_base_ref}" = "${EXPECTED_BASE_REF}" ] \
                    && [ "${current_base_sha}" = "${EXPECTED_BASE_SHA}" ] \
                    && [ "${default_branch}" = "${EXPECTED_BASE_REF}" ] \
                    && [ "${current_default_sha}" = "${EXPECTED_BASE_SHA}" ]; then
                  generation_current=true
                fi
              fi
            fi
          }
          refresh_generation_state

          publish_review() {
            local input=$1
            local response=$2
            local error=$3
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --input "${input}" --include > "${response}" 2> "${error}"
          }

          if [ "${planned_status}" = failed ]; then
            status=failed
          elif [ "${state_valid}" != true ]; then
            fallback_reason=PUBLICATION_STATE_LOOKUP_FAILED
            inline_count=0
          elif [ "${generation_current}" != true ]; then
            fallback_reason=STALE_BEFORE_PUBLICATION
            mode=summary
            inline_count=0
            jq 'if (.body | contains("Inline publication fallback:"))
                then . else
                  .body += "\n\nInline publication fallback: `STALE_BEFORE_PUBLICATION`."
                end | del(.commit_id)' "${summary_request}" \
              > codex-review-result/stale-summary-review-request.json
            if publish_review \
                codex-review-result/stale-summary-review-request.json \
                codex-review-result/review-response.txt \
                codex-review-result/review-error.txt; then
              status=published
            fi
          elif publish_review "${request}" \
              codex-review-result/review-response.txt \
              codex-review-result/review-error.txt; then
            status=published
          elif [ "${planned_mode}" = inline ]; then
            if grep -Eq '(^HTTP/[^ ]+ 422|\(HTTP 422\))' \
                codex-review-result/review-response.txt \
                codex-review-result/review-error.txt; then
              refresh_generation_state
              mode=summary
              inline_count=0
              if [ "${state_valid}" != true ]; then
                fallback_reason=PUBLICATION_STATE_LOOKUP_FAILED
              elif [ "${generation_current}" != true ]; then
                fallback_reason=STALE_BEFORE_PUBLICATION
                jq 'if (.body | contains("Inline publication fallback:"))
                    then . else
                      .body += "\n\nInline publication fallback: `STALE_BEFORE_PUBLICATION`."
                    end | del(.commit_id)' "${summary_request}" \
                  > codex-review-result/api-summary-review-request.json
                if publish_review \
                    codex-review-result/api-summary-review-request.json \
                    codex-review-result/summary-response.txt \
                    codex-review-result/summary-error.txt; then
                  status=published
                fi
              else
                fallback_reason=GITHUB_422
                jq --arg reason "${fallback_reason}" \
                  '.body += "\n\nInline publication fallback: `" + $reason + "`."' \
                  "${summary_request}" \
                  > codex-review-result/api-summary-review-request.json
                if publish_review \
                    codex-review-result/api-summary-review-request.json \
                    codex-review-result/summary-response.txt \
                    codex-review-result/summary-error.txt; then
                  status=published
                fi
              fi
            else
              fallback_reason=INLINE_PUBLICATION_FAILED
              inline_count=0
            fi
          else
            fallback_reason=SUMMARY_PUBLICATION_FAILED
          fi

          if [ -s "${helper}" ]; then
            python3 "${helper}" record \
              --result "${result}" \
              --status "${status}" \
              --mode "${mode}" \
              --fallback-reason "${fallback_reason}" \
              --inline-comment-count "${inline_count}" \
              --output "${result}"
          else
            jq \
              --arg status "${status}" \
              --arg mode "${mode}" \
              --arg reason "${fallback_reason}" \
              --argjson inline_count "${inline_count}" \
              '.publication={status:$status,mode:$mode,
                fallback_reason:(if $reason == "" then null else $reason end),
                inline_comment_count:$inline_count}
              | if $status == "failed" and .verdict == "clean"
                then .verdict="error"
                | .error={code:"PUBLICATION_FAILED",
                    reason:"The exact-head review result could not be published."}
                else . end' "${result}" > codex-review-result/codex-review-result.tmp
            mv codex-review-result/codex-review-result.tmp "${result}"
          fi

      - name: Upload exact-head machine result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: codex-review-result/codex-review-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        run: |
          set -euo pipefail
          result=codex-review-result/codex-review-result.json
          {
            echo "## Codex source_context_v1 review"
            echo
            echo "- Verdict: \`$(jq -r '.verdict' "${result}")\`"
            echo "- Head: \`$(jq -r '.head_sha' "${result}")\`"
            echo "- Base: \`$(jq -r '.base_ref + "@" + .base_sha' "${result}")\`"
            echo "- State: \`$(jq -r '.state' "${result}")\`"
            echo "- Scope: \`$(jq -r '.review_scope' "${result}")\`"
            echo "- Complete coverage: \`$(jq -r '.coverage.complete' "${result}")\`"
            echo "- Packets: \`$(jq -c '.activated_packets' "${result}")\`"
            echo "- Blocking: \`$(jq -r '.blocking_count' "${result}")\`"
            echo "- Non-blocking: \`$(jq -r '.non_blocking_count' "${result}")\`"
            echo "- Publication: \`$(jq -r '.publication.status + "/" + .publication.mode' "${result}")\`"
            fallback_reason=$(jq -r '.publication.fallback_reason // empty' "${result}")
            if [ -n "${fallback_reason}" ]; then
              echo "- Publication fallback: \`${fallback_reason}\`"
            fi
            echo "- Artifact: \`${RESULT_ARTIFACT}\`"
            error_code=$(jq -r '.error.code // empty' "${result}")
            if [ -n "${error_code}" ]; then
              echo "- Error: \`${error_code}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Gate pull request on machine verdict
        run: |
          set -euo pipefail
          result=codex-review-result/codex-review-result.json
          verdict=$(jq -r '.verdict' "${result}")
          publication=$(jq -r '.publication.status' "${result}")
          if [ "${verdict}" != clean ] || [ "${publication}" != published ]; then
            echo "Codex review gate failed closed: verdict=${verdict} publication=${publication}"
            exit 1
          fi
          echo "Codex source_context_v1 review passed for ${EXPECTED_HEAD_SHA}"
