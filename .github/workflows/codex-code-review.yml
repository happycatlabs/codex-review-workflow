name: Codex Code Review (reusable)

# Reusable workflow. Consumer repos call this via:
#
#   jobs:
#     review:
#       uses: happycatlabs/codex-review-workflow/.github/workflows/codex-code-review.yml@main
#       secrets: inherit
#
# See README.md and codex-code-review.md for architecture and extension docs.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Override to use a self-hosted or larger runner.'
        type: string
        required: false
        default: ubuntu-latest
      model:
        description: 'Codex model. Must be available on ChatGPT-subscription auth.'
        type: string
        required: false
        default: gpt-5.5
      codex-cli-version:
        description: 'Pinned @openai/codex npm version.'
        type: string
        required: false
        default: '0.124.0'
      sentry-project:
        description: 'Sentry project slug for the consumer repo. If empty, the Sentry-context step is skipped.'
        type: string
        required: false
        default: ''
      sentry-org:
        description: 'Sentry org slug. Defaults to "happycatlabs". Ignored if sentry-project is empty.'
        type: string
        required: false
        default: happycatlabs
      sentry-ticket-regex:
        description: 'Regex matching project ticket short-IDs (e.g. "FABLE-\\d+"). Used to detect Sentry issues from PR title/body. Ignored if sentry-project is empty.'
        type: string
        required: false
        default: ''
    secrets:
      CODEX_AUTH_JSON:
        description: 'Contents of ~/.codex/auth.json from `codex login`. Required.'
        required: true
      SENTRY_AUTH_TOKEN:
        description: 'Sentry auth token. Optional — only used when sentry-project is set.'
        required: false

concurrency:
  group: codex-structured-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-structured-review:
    name: Run Codex structured review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPOSITORY: ${{ github.repository }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      CHECKOUT_DIR: repo-checkout
      REVIEW_WORKSPACE: codex-review-workspace

    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v5
        with:
          path: ${{ env.CHECKOUT_DIR }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Fetch base and head refs
        run: |
          set -euxo pipefail
          git -C "${CHECKOUT_DIR}" fetch --no-tags origin \
            "${{ github.event.pull_request.base.ref }}" \
            +refs/pull/${{ github.event.pull_request.number }}/head

      # Incremental review state. Each codex review posts/updates a sticky
      # comment that carries a hidden marker with `last_reviewed_sha` and the
      # prior review JSON. Subsequent runs pick that up so the model can
      # focus on what changed since the previous review and dedupe findings
      # already raised. Falls back to a full review when:
      #   - no sticky comment exists (first review on the PR)
      #   - the recorded SHA is no longer in history (rebase / force-push)
      #   - PR title or any new commit message contains "[full-review]"
      - name: Resolve incremental review state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR="${RUNNER_TEMP}/codex-review-state"
          rm -rf "${STATE_DIR}"
          mkdir -p "${STATE_DIR}"

          LAST_REVIEWED_SHA=""
          STICKY_COMMENT_ID=""
          STICKY_COMMENT_NODE_ID=""
          : > "${STATE_DIR}/prior-review.json"

          # Find the most recently updated comment carrying our state marker.
          sticky_comment=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '[.[] | select(.body | contains("<!-- codex-review-state:v1"))] | sort_by(.updated_at) | last' \
            2>/dev/null || echo 'null')

          if [ -n "${sticky_comment}" ] && [ "${sticky_comment}" != "null" ]; then
            STICKY_COMMENT_ID=$(echo "${sticky_comment}" | jq -r '.id')
            STICKY_COMMENT_NODE_ID=$(echo "${sticky_comment}" | jq -r '.node_id')
            sticky_body=$(echo "${sticky_comment}" | jq -r '.body')
            LAST_REVIEWED_SHA=$(echo "${sticky_body}" \
              | sed -n 's/.*<!-- codex-review-state:v1 sha=\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)
            prior_b64=$(echo "${sticky_body}" \
              | sed -n 's/.*state=\([A-Za-z0-9+/=]*\).*/\1/p' | head -1)
            if [ -n "${prior_b64}" ]; then
              echo "${prior_b64}" | base64 -d > "${STATE_DIR}/prior-review.json" 2>/dev/null \
                || : > "${STATE_DIR}/prior-review.json"
            fi
          fi

          # Escape hatches.
          FORCE_FULL="false"
          if printf '%s' "${PR_TITLE:-}" | grep -qiE '\[full-review\]'; then
            FORCE_FULL="true"
          fi
          if [ -n "${LAST_REVIEWED_SHA}" ] && [ "${FORCE_FULL}" = "false" ]; then
            if git -C "${CHECKOUT_DIR}" log --format='%B' \
                "${LAST_REVIEWED_SHA}..${HEAD_SHA}" 2>/dev/null \
                | grep -qiE '\[full-review\]'; then
              FORCE_FULL="true"
            fi
          fi

          # Validate the recorded SHA is still in history.
          if [ -n "${LAST_REVIEWED_SHA}" ] && [ "${FORCE_FULL}" = "false" ]; then
            if ! git -C "${CHECKOUT_DIR}" cat-file -e "${LAST_REVIEWED_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::last-reviewed SHA ${LAST_REVIEWED_SHA} not in history (rebase or force-push); falling back to full review"
              FORCE_FULL="true"
            fi
          fi

          if [ "${FORCE_FULL}" = "true" ] || [ -z "${LAST_REVIEWED_SHA}" ]; then
            INCREMENTAL_MODE="full"
            FOCUS_FROM_SHA="${BASE_SHA}"
            : > "${STATE_DIR}/prior-review.json"
          else
            INCREMENTAL_MODE="incremental"
            FOCUS_FROM_SHA="${LAST_REVIEWED_SHA}"
          fi

          git -C "${CHECKOUT_DIR}" diff --name-only --diff-filter=ACMR \
            "${FOCUS_FROM_SHA}" "${HEAD_SHA}" > "${STATE_DIR}/focus-files.txt"

          if [ "${INCREMENTAL_MODE}" = "incremental" ]; then
            git -C "${CHECKOUT_DIR}" diff --name-only --diff-filter=ACMR \
              "${BASE_SHA}" "${FOCUS_FROM_SHA}" > "${STATE_DIR}/prior-files.txt"
            git -C "${CHECKOUT_DIR}" log --format='- %h %s' \
              "${FOCUS_FROM_SHA}..${HEAD_SHA}" > "${STATE_DIR}/new-commit-messages.txt"
          else
            : > "${STATE_DIR}/prior-files.txt"
            : > "${STATE_DIR}/new-commit-messages.txt"
          fi

          echo "${LAST_REVIEWED_SHA}" > "${STATE_DIR}/last-reviewed-sha.txt"
          echo "${STICKY_COMMENT_ID}" > "${STATE_DIR}/sticky-comment-id.txt"
          echo "${STICKY_COMMENT_NODE_ID}" > "${STATE_DIR}/sticky-comment-node-id.txt"
          echo "${FOCUS_FROM_SHA}" > "${STATE_DIR}/focus-from-sha.txt"
          echo "${INCREMENTAL_MODE}" > "${STATE_DIR}/incremental-mode.txt"

          echo "INCREMENTAL_MODE=${INCREMENTAL_MODE}"
          echo "FOCUS_FROM_SHA=${FOCUS_FROM_SHA}"
          echo "LAST_REVIEWED_SHA=${LAST_REVIEWED_SHA:-<none>}"
          echo "STICKY_COMMENT_ID=${STICKY_COMMENT_ID:-<none>}"
          echo "FOCUS files: $(wc -l < "${STATE_DIR}/focus-files.txt" | tr -d ' ')"
          echo "PRIOR files: $(wc -l < "${STATE_DIR}/prior-files.txt" | tr -d ' ')"

          {
            echo "STATE_DIR=${STATE_DIR}"
            echo "INCREMENTAL_MODE=${INCREMENTAL_MODE}"
            echo "FOCUS_FROM_SHA=${FOCUS_FROM_SHA}"
            echo "LAST_REVIEWED_SHA=${LAST_REVIEWED_SHA}"
            echo "STICKY_COMMENT_ID=${STICKY_COMMENT_ID}"
            echo "STICKY_COMMENT_NODE_ID=${STICKY_COMMENT_NODE_ID}"
          } >> "${GITHUB_ENV}"

      - name: Prepare isolated review workspace
        run: |
          set -euo pipefail
          rm -rf "${REVIEW_WORKSPACE}"
          mkdir -p "${REVIEW_WORKSPACE}/.github/tmp"
          python3 <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess

          checkout = pathlib.Path(os.environ["CHECKOUT_DIR"]).resolve()
          workspace = pathlib.Path(os.environ["REVIEW_WORKSPACE"]).resolve()

          def copy_file(rel_path: str) -> None:
              src = checkout / rel_path
              if not src.exists():
                  return
              # Git's `diff --name-only` can include submodule/gitlink paths that
              # are directories on disk (e.g. `.agents/shared-skills`). shutil.copy2
              # on a directory raises IsADirectoryError and fails the whole workspace
              # prep. Submodule internals aren't in scope for a PR review anyway —
              # skip silently.
              if src.is_dir():
                  return
              dest = workspace / rel_path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)

          def copy_dir(rel_path: str) -> None:
              src = checkout / rel_path
              if not src.exists() or not src.is_dir():
                  return
              dest = workspace / rel_path
              if dest.exists():
                  shutil.rmtree(dest)
              shutil.copytree(src, dest)

          required_files = [
              "AGENTS.md",
              "REVIEW.md",
              "docs/review.md",
              ".codex/skills/convex-best-practices/SKILL.md",
          ]
          for rel_path in required_files:
              copy_file(rel_path)

          # Feature-scoped review packets — matching packets are picked by the
          # reviewer per-diff via their YAML `applies_to` frontmatter.
          copy_dir(".review")

          claude_path = workspace / "CLAUDE.md"
          if claude_path.exists() or claude_path.is_symlink():
              claude_path.unlink()
          claude_path.symlink_to("AGENTS.md")

          changed_files = subprocess.run(
              [
                  "git",
                  "-C",
                  str(checkout),
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMR",
                  os.environ["BASE_SHA"],
                  os.environ["HEAD_SHA"],
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          # Partition changed files into FOCUS (touched since last review)
          # and PRIOR (already reviewed and unchanged since). The state dir
          # is populated by the "Resolve incremental review state" step.
          state_dir = pathlib.Path(os.environ["STATE_DIR"])
          focus_files = set(
              state_dir.joinpath("focus-files.txt").read_text().splitlines()
          ) - {""}
          prior_files = set(
              state_dir.joinpath("prior-files.txt").read_text().splitlines()
          ) - {""}

          manifest_lines = []
          for rel_path in changed_files:
              if rel_path in focus_files:
                  manifest_lines.append(f"[FOCUS] {rel_path}")
              elif rel_path in prior_files:
                  manifest_lines.append(f"[PRIOR] {rel_path}")
              else:
                  # Shouldn't happen — fall back to FOCUS so nothing slips
                  # through unmarked.
                  manifest_lines.append(f"[FOCUS] {rel_path}")

          manifest = workspace / ".github" / "tmp" / "changed-files.txt"
          manifest.write_text("\n".join(manifest_lines) + ("\n" if manifest_lines else ""))

          for rel_path in changed_files:
              copy_file(rel_path)

          # Mirror state-dir context into the workspace so the prompt step
          # can append it without reaching outside the workspace.
          tmp_dir = workspace / ".github" / "tmp"
          for name in (
              "prior-review.json",
              "new-commit-messages.txt",
              "incremental-mode.txt",
              "last-reviewed-sha.txt",
              "focus-from-sha.txt",
          ):
              src = state_dir / name
              if src.exists():
                  shutil.copy2(src, tmp_dir / name)
          PY

      - name: Install Sentry CLI
        if: ${{ inputs.sentry-project != '' }}
        run: npm install -g @sentry/cli

      - name: Build sanitized Sentry review context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ inputs.sentry-org }}
          SENTRY_PROJECT: ${{ inputs.sentry-project }}
          TICKET_REGEX: ${{ inputs.sentry-ticket-regex }}
        run: |
          set -euo pipefail
          mkdir -p "${REVIEW_WORKSPACE}/.github/tmp"
          out_file="${REVIEW_WORKSPACE}/.github/tmp/sentry-review-context.md"

          if [ -z "${SENTRY_PROJECT:-}" ]; then
            printf '# Sentry review context\n\nSentry context not configured for this repo.\n' > "$out_file"
            exit 0
          fi

          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          title = os.environ.get('PR_TITLE', '')
          body = os.environ.get('PR_BODY', '')
          text = '\n\n'.join([title, body])

          ticket_regex = os.environ.get('TICKET_REGEX', '').strip()
          short_ids = sorted(set(re.findall(ticket_regex, text))) if ticket_regex else []
          sentry_urls = sorted(set(re.findall(r'https?://[^\s]*sentry\.io/issues/(\d+)', text)))

          project = os.environ['SENTRY_PROJECT']
          org = os.environ.get('SENTRY_ORG', '')

          out = pathlib.Path(os.environ['REVIEW_WORKSPACE']) / '.github' / 'tmp' / 'sentry-review-context.md'
          lines = ['# Sentry review context', '']

          if not short_ids and not sentry_urls:
              lines.append('No explicit Sentry issue mention found in PR title/body.')
              out.write_text('\n'.join(lines) + '\n')
              raise SystemExit(0)

          token = os.environ.get('SENTRY_AUTH_TOKEN', '').strip()
          if not token:
              lines.extend([
                  'Explicit Sentry issue mention found, but `SENTRY_AUTH_TOKEN` is not configured.',
                  'Continue review without inventing live Sentry details.',
              ])
              out.write_text('\n'.join(lines) + '\n')
              raise SystemExit(0)

          subprocess.run(['sentry-cli', '--version'], check=True, capture_output=True, text=True)
          info = subprocess.run(['sentry-cli', 'info'], capture_output=True, text=True)
          if info.returncode != 0:
              lines.extend([
                  'Sentry CLI auth/config validation failed.',
                  '',
                  '```text',
                  (info.stderr or info.stdout).strip(),
                  '```',
              ])
              out.write_text('\n'.join(lines) + '\n')
              raise SystemExit(0)

          def run(args):
              env = os.environ.copy()
              if org:
                  env.setdefault('SENTRY_ORG', org)
              env.setdefault('SENTRY_PROJECT', project)
              return subprocess.run(['sentry-cli', *args], env=env, capture_output=True, text=True)

          for short_id in short_ids:
              res = run(['issues', 'list', '--project', project, '--query', short_id, '--max-rows', '5'])
              lines.extend([f'## {short_id}', ''])
              lines.extend(['```text', (res.stdout or res.stderr).strip(), '```', ''])

          for issue_id in sentry_urls:
              res = run(['issues', 'list', '--project', project, '--id', issue_id, '--max-rows', '5'])
              lines.extend([f'## sentry-url:{issue_id}', ''])
              lines.extend(['```text', (res.stdout or res.stderr).strip(), '```', ''])

          out.write_text('\n'.join(lines) + '\n')
          PY

      - name: Generate structured output schema
        run: |
          set -euo pipefail
          cat <<'JSON' > "${REVIEW_WORKSPACE}/codex-output-schema.json"
          {
            "type": "object",
            "properties": {
              "result": {
                "type": "string",
                "enum": ["NO_ISSUES", "HAS_FINDINGS"]
              },
              "comment_body": {
                "type": "string",
                "minLength": 1
              }
            },
            "required": ["result", "comment_body"],
            "additionalProperties": false
          }
          JSON

      - name: Build Codex review prompt
        run: |
          set -euo pipefail
          # Prompt structured per gpt-5.5 prompting guidance
          # (https://developers.openai.com/api/docs/guides/prompt-guidance):
          # outcome-first sections, decision rules instead of mechanical
          # absolutes, explicit Stop conditions. Hard invariants stay
          # absolute (Convex backwards-compat, schema, allowlist); judgment
          # calls became decision rules.
          cat <<'PROMPT' > "${REVIEW_WORKSPACE}/codex-prompt.md"
          # Role

          You are a senior engineer reviewing a PR for a React Native + Expo app backed by Convex. You produce structured JSON output that gates the PR.

          # Personality

          Be terse and specific. Quote exact code, name exact files, describe exact failure scenarios. Don't explain what code does — the author knows. Don't hedge. If you'd say "probably," delete the finding.

          # Goal

          Find issues in this PR's diff that would break production: bugs, regressions, security holes, data loss, or backwards-incompatible Convex changes. Output a JSON verdict (`NO_ISSUES` or `HAS_FINDINGS`) plus a PR comment.

          "No issues found" is a valid and preferred outcome. Most PRs from experienced engineers are correct. Don't manufacture findings.

          # Workspace

          The review workspace is isolated. It contains only:

          - Context files: `AGENTS.md` / `CLAUDE.md`, `REVIEW.md`, `docs/review.md`, selected skill files
          - `.review/*.md` — feature-scoped review packets. Read packets whose YAML frontmatter `applies_to` globs match a changed file. Always read packets without `applies_to`. Skip packets with `applies_to: []` (meta files).
          - `.github/tmp/changed-files.txt` — the review allowlist. Each line is prefixed `[FOCUS]` (touched since the last review) or `[PRIOR]` (already reviewed and unchanged since).
          - The PR-changed files at HEAD
          - `.github/tmp/sentry-review-context.md`

          Read `REVIEW.md` and `docs/review.md` before reviewing — they carry domain conventions that override generic instincts.

          # Review mode

          This may be the first review of this PR or a re-review after additional commits. The PR context below tells you which.

          - **First review** — no `## Prior review` section appears. Treat all changed files as `[FOCUS]`.
          - **Re-review** — a `## Prior review` section appears with the previous SHA, verdict, and comment. The `[FOCUS]` files were touched since that review; the `[PRIOR]` files were already reviewed.

          On a re-review:

          - Analyze `[FOCUS]` files in detail.
          - Flag a `[PRIOR]` file only if a new commit elsewhere in the diff makes a previously-invisible issue visible (e.g. a new caller exposes a latent bug). Don't re-derive findings already in the prior review.
          - Treat each prior finding as accepted unless the new commits changed something material. Don't re-list a finding the new commits already addressed.
          - The prior verdict is informative, not binding. If you now disagree with a prior finding, say so. If the prior verdict was `NO_ISSUES`, you can still raise a new finding from the new commits.

          # Project context

          - `.github/tmp/changed-files.txt` is the allowlist. Don't flag files outside it.
          - For Convex changes (any file under `convex/`), apply `.codex/skills/convex-best-practices/SKILL.md`.
          - Sentry: only use `.github/tmp/sentry-review-context.md` if the PR title or body explicitly names a Sentry issue. Don't infer Sentry context from arbitrary numeric IDs. If the file says auth/config is missing, don't invent issue details.
          - Ignore `.github/workflows/codex-code-review.yml` — never flag the review workflow itself.

          # What counts as a finding

          A finding describes a specific production failure with all three:

          - The exact file and line(s)
          - The exact code, quoted
          - The input or sequence that triggers the failure with the code as shipped

          If you can't fill in all three, it isn't a finding.

          # Severity

          - **CRITICAL** — will break production: data loss, crashes, security holes, backwards-incompatible Convex changes.
          - **BUG** — incorrect behavior users will hit: logic errors, unhandled error paths.
          - **RISK** — works today but has a reproducible failure with current inputs and callers. You must name the input or sequence. "Could break if someone adds X" is speculation, not RISK. Drop it.

          # Invariants

          1. **The diff is the source of truth.** Review what shipped, not what the PR description promises. If the description mentions feature X but the diff doesn't, the approach changed — don't flag missing code.
          2. **Code movement isn't a behavior change.** When code is moved, extracted, or centralized, compare removed lines to added lines before claiming behavior changed. Identical patterns on both sides = no behavioral change.
          3. **Convex changes must be backwards-compatible.** Convex deploys atomically; old clients call new server code and vice versa. Always CRITICAL if violated:
             - Schema: removing or renaming fields, changing types, or adding non-optional fields. New fields use `v.optional()`.
             - Function args: removing or changing args, or adding required args. New args use `v.optional()` or defaults.
             - Return types: removing fields, breaking-shape changes.
             - Migrations: code assuming all docs already have a new field.
          4. **Repo structure.** `app/` is routes and layouts only (Expo Router entries, `_layout.tsx`, `+not-found.tsx`). Shared utilities/hooks/constants live outside `app/` (e.g. `lib/`, `hooks/`, `components/`). Non-route helpers under `app/` → flag as RISK with file references.
          5. **Output is JSON matching the schema.** `result` is `NO_ISSUES` or `HAS_FINDINGS`. `comment_body` is a single PR comment for humans.

          # Decision rules

          - **Speculation filter.** Before including a finding, ask: "What concrete input or sequence triggers the failure with the code as shipped?" If the answer involves "if someone adds," "the next person might," "could," "might," or "consider" — drop it.
          - **Comments are evidence.** If a code comment explains *why* something is done, the author already considered it. Don't contradict unless you can prove it factually wrong.
          - **Tests.** Flag missing tests only for pure functions and testable logic with a specific failure scenario you can name. Don't suggest integration tests for handlers without a concrete failure.
          - **Root cause over symptoms.** Multiple broken flows from one misused constant or wrong hook = one finding with the symptoms as evidence, not N findings. Same for constant/identifier changes affecting multiple call sites — flag the migration once.
          - **Idempotency in retry logic.** When a PR wraps a non-idempotent op in retry, frame findings around which error signals *prove* the server never processed the request. Don't enumerate individual unsafe error patterns.
          - **Validation completeness.** When a fix sanitizes or validates one field in a structured object, check whether sibling fields need the same treatment, on both the detection and generation sides.
          - **Destructive downstream.** If selection logic feeds a pipeline that deletes or overwrites the selected rows, escalate selection bugs to CRITICAL — they're data-loss bugs.

          # Don't suggest

          These are style preferences, not findings:

          - Extracting constants for well-known values (HTTP codes, common thresholds)
          - Type predicates the caller doesn't actually use as narrowed
          - "Consistent naming" across code with different purposes
          - Adding fields to log statements already covered by other fields
          - Wrapping things in abstractions with fewer than 3 call sites
          - "Standardizing" error formats when errors carry different relevant fields
          - Defensive checks for scenarios the control flow excludes
          - Pre-emptive parameterization for callers that don't exist

          # Output

          Return JSON matching the schema:

          - `result`: `NO_ISSUES` or `HAS_FINDINGS`. Use `HAS_FINDINGS` only when at least one finding meets the bar above.
          - `comment_body`: a complete PR comment.
            - If findings: list by severity with file:line references and quoted code.
            - If none: `"No issues found. [one sentence on what the PR does]."`
            - Don't include sections labelled Strengths, Style, Enhancements, Recommendations, Nice to have, Minor Issues, or Suggestions.

          # Stop

          - After emitting JSON, you're done.
          - Don't read files outside the workspace or the allowlist.
          - Don't walk through the code explaining what it does.
          PROMPT

          INCREMENTAL_MODE_FILE="${REVIEW_WORKSPACE}/.github/tmp/incremental-mode.txt"
          PRIOR_REVIEW_FILE="${REVIEW_WORKSPACE}/.github/tmp/prior-review.json"
          NEW_COMMITS_FILE="${REVIEW_WORKSPACE}/.github/tmp/new-commit-messages.txt"
          LAST_REVIEWED_SHA_FILE="${REVIEW_WORKSPACE}/.github/tmp/last-reviewed-sha.txt"

          INCREMENTAL_MODE="full"
          if [ -s "${INCREMENTAL_MODE_FILE}" ]; then
            INCREMENTAL_MODE=$(cat "${INCREMENTAL_MODE_FILE}")
          fi

          {
            echo ""
            echo "# PR"
            echo ""
            echo "- Repository: ${REPOSITORY}"
            echo "- Pull Request #: ${PR_NUMBER}"
            echo "- Base SHA: ${BASE_SHA}"
            echo "- Head SHA: ${HEAD_SHA}"
            echo "- Review mode: ${INCREMENTAL_MODE}"
            echo ""
            echo "## Title"
            echo ""
            echo "${PR_TITLE}"
            echo ""
            echo "## Body"
            echo ""
            echo "${PR_BODY}"
            echo ""

            if [ "${INCREMENTAL_MODE}" = "incremental" ] && [ -s "${PRIOR_REVIEW_FILE}" ]; then
              prior_sha=""
              if [ -s "${LAST_REVIEWED_SHA_FILE}" ]; then
                prior_sha=$(cat "${LAST_REVIEWED_SHA_FILE}")
              fi
              prior_result=$(jq -r '.result // "UNKNOWN"' "${PRIOR_REVIEW_FILE}")
              prior_body=$(jq -r '.comment_body // ""' "${PRIOR_REVIEW_FILE}")

              echo "## Prior review"
              echo ""
              echo "- SHA reviewed: ${prior_sha}"
              echo "- Verdict: ${prior_result}"
              echo ""
              echo "### Prior comment"
              echo ""
              printf '%s\n' "${prior_body}"
              echo ""

              if [ -s "${NEW_COMMITS_FILE}" ]; then
                echo "## Commits since prior review"
                echo ""
                cat "${NEW_COMMITS_FILE}"
                echo ""
              fi
            fi

            echo "## Changed files (allowlist)"
            echo ""
            echo '```'
            cat "${REVIEW_WORKSPACE}/.github/tmp/changed-files.txt"
            echo '```'
            echo ""
            echo "## Status"
            echo ""
            echo '```'
            git -C "${CHECKOUT_DIR}" --no-pager diff --name-status "${BASE_SHA}" "${HEAD_SHA}"
            echo '```'
            echo ""
            echo "## Unified diff (context=5)"
            echo ""
            echo '```diff'
            git -C "${CHECKOUT_DIR}" --no-pager diff --unified=5 "${BASE_SHA}" "${HEAD_SHA}"
            echo '```'
          } >> "${REVIEW_WORKSPACE}/codex-prompt.md"

      - name: Remove full checkout before review
        run: |
          set -euo pipefail
          rm -rf "${CHECKOUT_DIR}"

      # Bill the review against a Codex/ChatGPT subscription instead of an
      # API key (api-key billing was hitting quota). openai/codex-action@main
      # only accepts `openai-api-key` for auth, so we drop it and call
      # `codex exec` directly with a pre-seeded ~/.codex/auth.json.
      # The auth.json comes from `codex login` on a developer machine and is
      # stored as the CODEX_AUTH_JSON repo secret. If/when the OAuth refresh
      # token expires, re-run `codex login` and update the secret.
      - name: Install Codex CLI
        run: npm install -g "@openai/codex@${{ inputs.codex-cli-version }}"

      - name: Seed Codex auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codex"
          chmod 700 "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Run Codex structured review
        id: run-codex
        run: |
          set -euo pipefail
          codex exec \
            --model "${{ inputs.model }}" \
            --sandbox read-only \
            --skip-git-repo-check \
            --cd "${REVIEW_WORKSPACE}" \
            --output-schema "${REVIEW_WORKSPACE}/codex-output-schema.json" \
            --output-last-message "${REVIEW_WORKSPACE}/codex-output.json" \
            - < "${REVIEW_WORKSPACE}/codex-prompt.md"

      - name: Inspect structured output
        if: ${{ always() }}
        run: |
          if [ -s "${REVIEW_WORKSPACE}/codex-output.json" ]; then
            jq '.' "${REVIEW_WORKSPACE}/codex-output.json"
          else
            echo "Codex output file missing"
            exit 1
          fi

      # Sticky review comment, posted-then-minimize style. Each run posts a
      # fresh comment carrying a hidden marker
      # `<!-- codex-review-state:v1 sha=<HEAD> state=<base64-json> -->`, then
      # collapses the previous sticky via GitHub's `minimizeComment` GraphQL
      # mutation with classifier OUTDATED. The previous comment stays in the
      # timeline as a "marked as outdated" line reviewers can expand if they
      # want the history. The new comment lands at the bottom of the
      # timeline, anchored to the commits it actually describes.
      - name: Publish review comment
        if: ${{ steps.run-codex.outcome == 'success' }}
        env:
          REVIEW_JSON: ${{ env.REVIEW_WORKSPACE }}/codex-output.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_body=$(jq -r '.comment_body' "$REVIEW_JSON")
          state_b64=$(base64 < "$REVIEW_JSON" | tr -d '\n')
          full_body=$(printf '%s\n\n<!-- codex-review-state:v1 sha=%s state=%s -->\n' \
            "$comment_body" "$HEAD_SHA" "$state_b64")

          # Post the new sticky.
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -n --arg body "$full_body" '{body: $body}')" >/dev/null

          # Minimize the previous sticky if there was one. We use the
          # GraphQL node id captured in the state-resolution step. Failures
          # here aren't fatal — the new sticky is already up; collapse is
          # cosmetic.
          if [ -n "${STICKY_COMMENT_NODE_ID:-}" ]; then
            gh api graphql \
              -f query='mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }' \
              -f id="${STICKY_COMMENT_NODE_ID}" \
              >/dev/null \
              || echo "::warning::failed to minimize previous sticky comment ${STICKY_COMMENT_NODE_ID}"
          fi

      - name: Gate PR on Codex result
        if: ${{ steps.run-codex.outcome == 'success' }}
        env:
          REVIEW_JSON: ${{ env.REVIEW_WORKSPACE }}/codex-output.json
        run: |
          set -euo pipefail
          result=$(jq -r '.result' "$REVIEW_JSON")
          if [ "$result" != "NO_ISSUES" ]; then
            echo "Codex review gate failed: result=$result"
            exit 1
          fi
          echo "Codex review gate passed: NO_ISSUES"

      - name: Upload Codex artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-artifacts
          path: |
            ${{ env.REVIEW_WORKSPACE }}/codex-prompt.md
            ${{ env.REVIEW_WORKSPACE }}/codex-output-schema.json
            ${{ env.REVIEW_WORKSPACE }}/codex-output.json
            ${{ env.REVIEW_WORKSPACE }}/.github/tmp/sentry-review-context.md
            ${{ env.REVIEW_WORKSPACE }}/.github/tmp/changed-files.txt
            ${{ env.REVIEW_WORKSPACE }}/.github/tmp/prior-review.json
            ${{ env.REVIEW_WORKSPACE }}/.github/tmp/new-commit-messages.txt
            ${{ env.REVIEW_WORKSPACE }}/.github/tmp/incremental-mode.txt
